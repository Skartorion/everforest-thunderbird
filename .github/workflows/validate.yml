name: Build XPI

on:
  push:
    paths-ignore:
      - everforest-dark-medium.xpi
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpi-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package XPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test and build compressed XPI
        run: npm run build
      - name: Verify XPI archive integrity
        run: |
          for xpi in dist/*.xpi; do
            python3 -m zipfile -t "$xpi"
          done
      - name: Upload installable XPI
        uses: actions/upload-artifact@v4
        with:
          name: everforest-dark-medium-${{ github.sha }}
          path: dist/*.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Commit XPI to repository
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: everforest-dark-medium-${{ github.sha }}
          path: dist
      - name: Commit updated package without triggering another build
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never publish an older build over a newer source commit.
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Branch advanced since this build; skipping stale package."
            exit 0
          fi
          install -m 644 dist/*.xpi everforest-dark-medium.xpi
          git add -- everforest-dark-medium.xpi
          if git diff --cached --quiet; then
            echo "Package is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update packaged XPI [skip ci]"
          # Normal push only: concurrent commits or branch protection must not be bypassed.
          git push origin "HEAD:$TARGET_BRANCH"
